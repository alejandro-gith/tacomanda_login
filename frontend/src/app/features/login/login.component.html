<main class="login-screen">
  <section class="login-card" aria-labelledby="title">
    <div class="logo">
      <span>🌮</span>
      <h1 id="title">Tacos Angy</h1>
      <p>Sistema de gestión</p>
    </div>
    <div class="divider"><i></i><b>acceso al puesto</b><i></i></div>
    <form (ngSubmit)="f.submit()">
      <div class="field">
        <label for="user">Usuario</label
        ><select
          id="user"
          name="user"
          [(ngModel)]="f.employeeId"
          [disabled]="f.loading()"
          required
        >
          <option value="" disabled>Selecciona tu usuario</option>
          @for (user of f.users(); track user.id) {
            <option [value]="user.id">
              {{ user.displayName }} · {{ user.role }}
            </option>
          }
        </select>
      </div>
      <div class="field">
        <label for="password">Contraseña</label
        ><input
          id="password"
          name="password"
          [(ngModel)]="f.password"
          type="password"
          autocomplete="current-password"
          maxlength="128"
          required
          placeholder="••••••••"
        />
      </div>
      @if (f.error()) {
        <p class="error" role="alert">Error en el sistema.</p>
      }
      <button
        type="submit"
        [disabled]="
          f.submitting() || f.loading() || !f.employeeId || !f.password
        "
      >
        {{ f.submitting() ? "INGRESANDO…" : "ENTRAR AL PUESTO" }}
      </button>
    </form>
    <small>Selecciona la cuenta del empleado que recibe el turno.</small>
  </section>
</main>
